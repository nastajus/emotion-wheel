<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Emotion Wheel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="emotion-container">
    <svg id="wheel" class="wheel" viewBox="-60 -60 520 520" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div id="popup" style="display: none;">
    <span id="popup-close">✖</span>
    <div id="popup-label"></div>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
